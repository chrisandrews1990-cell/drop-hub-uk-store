name: Validate Cloudflare build and deploy preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare Function syntax
        run: find functions -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build Cloudflare static output
        run: npm run build

      - name: Setup Pages preview
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "dist"

      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
